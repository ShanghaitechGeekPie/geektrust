name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check release scripts
        run: bash -n scripts/package-release.sh scripts/package-release-uv.sh

      - name: Build release packages
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ci' }}
        run: bash scripts/package-release.sh "$RELEASE_VERSION" dist

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Verify release checksums
        run: cd dist && sha256sum --check SHA256SUMS

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release packages
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME" dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz
          dist/*.zip
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
