name: Build and Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build panel
        run: npm --prefix web ci && npm --prefix web run build
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./client ./internal/runtime ./internal/idsauth ./internal/session ./internal/tunnel ./internal/l3 ./internal/resolver ./internal/webui ./internal/storage
      - name: Static analysis
        run: go vet ./...
      - name: Build packages
        run: go build ./...
