# geekTrust 配置版本 2。相对路径相对于本文件。
# 上科大只需提供已有 Passkey；缺省启用本地代理和 Web 面板。
config_version = 2

[auth.passkey]
keystore = "./ids-passkey.keystore"

# 下列分组可按需启用。省略表示使用默认值。
# [controller]
# url = "https://vpn.shanghaitech.edu.cn"
# compatibility = "auto" # auto / shanghaitech / ecnu / generic
# platform = "Mac"   # 控制器协议参数，与本机系统无关

# [auth]
# mode = "auto"      # auto / client / browser
# login_domain = ""
# device_id = ""     # 缺省读取或创建持久身份；升级时保留既有 ID

# [proxy.socks5]
# listen = "127.0.0.1:1080" # 空字符串禁用
# [proxy.http]
# listen = "127.0.0.1:8080"
# [web]
# listen = "127.0.0.1:8081" # 只允许回环地址；空字符串禁用

# [dns]
# strategy = "auto"  # auto 保留 CLI 的既有顺序；controller 只走控制器 DNS
# servers = []       # 空列表使用控制器下发的 DNS

# [storage]
# directory = ""     # 缺省使用平台用户私有持久目录
# state_file = ""    # 留空使用 directory/session.enc；非空覆盖会话文件读写路径
# strict_permissions = false # 权限问题默认只警告；设为 true 时拒绝权限不合格的文件

# [logging]
# level = "info"

# 高级设置只在实际部署需要时填写。证书验证始终开启。
# [tls.gateway]
# server_name = ""
# ca_file = ""
# [routing]
# gateway_filter = [] # 显式空列表拒绝所有线路；省略不额外筛选
# fallback_app_id = ""
